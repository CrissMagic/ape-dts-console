name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - name: Verify immutable migration checksums
        run: |
          node --input-type=module -e "import {loadMigrationBundle} from './packages/database/dist/index.js'; const bundle=await loadMigrationBundle(); console.log('Verified migrations:', bundle.migrations.length)"
      - run: corepack pnpm test
      - run: corepack pnpm build
